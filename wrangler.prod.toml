#:schema node_modules/wrangler/config-schema.json
# Production configuration (real D1/KV ids).
#
# R2 is intentionally omitted: the target account has not enabled R2 yet
# (API error 10042). Enable R2 in the Cloudflare dashboard, create the bucket,
# then add the binding below and redeploy.
#
#   [[r2_buckets]]
#   binding = "R2"
#   bucket_name = "qexo-images"

name = "qexo-workers"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "src/ui"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/index.html", "/login", "/login.html", "/api/*", "/pub/*", "/webhook/*", "/mcp"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "qexo"
database_id = "e67e85cb-e28c-408a-b2cf-28e9f9839a47"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "e0892d23927d427e8ace479fa4682724"

[vars]
PUBLIC_ORIGIN = ""
# Public Turnstile sitekey (not a secret). Login protection activates only after
# the operator sets TURNSTILE_SECRET and TURNSTILE_HOSTNAMES as Worker secrets.
TURNSTILE_SITE_KEY = "0x4AAAAAAGBqe3KzCG_zIoD7"
# Comma-separated production frontend hostname(s). Never include localhost or
# 127.0.0.1 in a production allowlist.
# TURNSTILE_HOSTNAMES = "admin.example.com"
