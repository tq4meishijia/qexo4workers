<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="same-origin" />
  <title>Qexo · Workers</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <!-- 同步加载：首次绘制前从 Cookie 还原风格，避免刷新时闪默认主题 -->
  <script src="/js/style-library.js"></script>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark">Q</div>
    <div class="boot-text">正在加载控制台…</div>
  </div>

  <div id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">Q</span>
        <span class="brand-text">
          <strong id="brand-name">Qexo</strong>
          <small>Workers Edition</small>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="version" id="version">—</div>
        <button class="nav-item as-button" id="logout"><span class="ico" data-ico="logout"></span><span>退出登录</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn only-mobile" id="menu-toggle" aria-label="菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div>
            <h1 id="page-title">控制台</h1>
            <div class="crumbs" id="crumbs"></div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="pill" id="provider-pill">未配置内容源</span>
          <div class="avatar" id="avatar">A</div>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h2 id="modal-title">提示</h2>
        <button class="icon-btn" id="modal-close" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
